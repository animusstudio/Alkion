name: app-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # real-DB tests fetch a native lib at build time; cap a stalled fetch instead of running for hours
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      # Calls flutter directly (no fvm on this runner; flutter-action already
      # pins the right version onto PATH). The never-run-flutter-directly rule
      # is for local dev, where fvm is how the Makefile resolves the pin.
      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        env:
          # Child Make CLI checks use the Dart shipped by flutter-action.
          ALKION_TEST_DART: dart
        run: flutter test
