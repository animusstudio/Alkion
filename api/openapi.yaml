openapi: 3.1.0
info:
  title: Workout Tracker API
  version: 0.1.0
  description: >
    Auth surface for the workout-tracker server. Issues a short-lived API access
    JWT plus a rotating refresh token, mints short-lived PowerSync tokens, and
    publishes the RS256 public key as a JWKS.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      summary: Readiness probe (checks the database)
      operationId: getReadyz
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set (public signing key)
      operationId: getJwks
      responses:
        "200":
          description: The signing key set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
  /auth/login:
    post:
      summary: Exchange email + password for tokens
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/refresh:
    post:
      summary: Rotate the refresh token and get a fresh access token
      operationId: postAuthRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The token could not be checked; transient, retry later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      summary: Revoke the refresh token family
      operationId: postAuthLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Revoked
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/powersync-token:
    post:
      summary: Mint a short-lived PowerSync token for the authenticated user
      operationId: postAuthPowerSyncToken
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A PowerSync token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerSyncTokenResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sync/upload:
    post:
      summary: Apply a batch of PowerSync client write operations
      description: >
        Target of the PowerSync client uploadData connector. Applies the whole
        batch in one transaction. Per the PowerSync contract this endpoint never
        returns 4xx for validation/ownership errors (that would permanently block
        the client's upload queue); such ops are logged and skipped and the
        response is still 200. 5xx indicates a transient error the client should
        retry.
      operationId: postSyncUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Batch processed (applied count may be less than submitted if ops were skipped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Transient error; retry the same batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /migration/transitions/{id}/{action}:
    post:
      summary: Independently consent to an old account writer decision
      description: >
        Registered only with explicit REPS_MIGRATION_PEER_CONFIG. Requires the
        old API JWT subject to equal the exact old account and explicit recorded
        owner consent. Surrender and unfreeze read authenticated Hub status;
        uploaded peer receipts cannot authorize decisions. Failure stays closed.
      operationId: controlMigrationTransition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [freeze, surrender, unfreeze]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../server/internal/migration/testdata/reps-migration-peer.schema.json#/$defs/owner_control"
      responses:
        "200":
          description: Immutable decision; exact retries return the same result
          content:
            application/json:
              schema:
                $ref: "../server/internal/migration/testdata/reps-migration-peer.schema.json#/$defs/receipt"
        "400":
          description: Malformed or noncanonical control request
        "401":
          description: Old account JWT verification failed
        "403":
          description: Independent old owner consent or account binding missing
        "404":
          description: Controls unconfigured or action unknown
        "415":
          description: application/json required
        "503":
          description: Unavailable, unknown or conflicting authority; writer remains closed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Status:
      type: object
      properties:
        status:
          type: string
      required: [status]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
      required: [access_token, token_type, expires_in, refresh_token]
    PowerSyncTokenResponse:
      type: object
      properties:
        endpoint:
          type: string
        token:
          type: string
        expires_at:
          type: integer
      required: [endpoint, token, expires_at]
    JWK:
      type: object
      properties:
        kty:
          type: string
        use:
          type: string
        alg:
          type: string
        kid:
          type: string
        n:
          type: string
        e:
          type: string
      required: [kty, alg, kid, n, e]
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"
      required: [keys]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
          required: [message]
      required: [error]
    UploadRequest:
      type: object
      properties:
        batch:
          type: array
          items:
            $ref: "#/components/schemas/CrudOp"
      required: [batch]
    CrudOp:
      type: object
      properties:
        op:
          type: string
          enum: [PUT, PATCH, DELETE]
        table:
          type: string
          enum: [exercises, sessions, sets, bodyweight_logs, day_templates, day_template_items]
        id:
          type: string
        data:
          type: object
          additionalProperties: true
      required: [op, table, id]
    UploadResult:
      type: object
      properties:
        applied:
          type: integer
      required: [applied]
