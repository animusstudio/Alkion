# Approved character arm. Android is the only scaffolded product platform.
# Reproduce from the retained SVG with: make -C app brand-icons
flutter_launcher_icons:
  image_path: "assets/icon/alkion-icon-1024.png"
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/alkion-foreground-1024.png"
