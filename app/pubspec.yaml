name: alkion
description: Alkion development client, by Animus. Local foundation qualification.
publish_to: none
version: 0.18.1+37

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Official Flutter localization (ARB/gen_l10n) delegates.
  flutter_localizations:
    sdk: flutter
  # Message formatting / Locale support used by generated AppLocalizations.
  intl: any
  # Standalone SQLite; pinned native factory qualified for local workflows.
  sqlite3: 3.5.0
  sqlite_async: 0.14.7
  # App-support dir for the local DB file.
  path_provider: ^2.1.4
  path: ^1.9.0
  # Local Space Grotesk / Space Mono styles through Google Fonts.
  google_fonts: ^6.2.1
  # Reactive state management (UnitService, ActiveSessionController).
  provider: ^6.1.2
  # Retained test-only preference fixtures; semantic app state uses SQLite.
  shared_preferences: ^2.3.2
  # Export delivery: opens the Android share sheet with the JSON file.
  share_plus: ^11.0.0
  # Ongoing workout notification (Android): chronometer elapsed / rest countdown.
  flutter_local_notifications: ^21.0.0
  # OS-alarm scheduling for the rest-end notification revert (transitive via
  # flutter_local_notifications; declared direct since we import tz/data).
  timezone: ^0.11.0
  # Profile, revision, restore and deterministic compatibility IDs.
  uuid: ^4.5.0
  # SHA-256 for local store, backup, transfer and schema evidence digests.
  crypto: ^3.0.7
  # Runtime app version footer; no update transport.
  package_info_plus: ^8.0.0
  # Optional foreground Animus connection; no default persistent OIDC store.
  oidc: 5.0.2
  flutter_secure_storage: 10.3.4
  http: 1.6.0
  # Direct adapter imports, pinned to the already resolved dependency set.
  dbus: 0.7.12
  logging: 1.3.0
  oidc_platform_interface: 1.0.4
  oidc_android: 3.0.1
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Existing native pool, pinned directly for leased close/fault regressions.
  sqlite3_connection_pool: 0.2.15
  # Generates the Android launcher icon (incl. adaptive) from assets/icon/.
  # Config and approved source: flutter_launcher_icons.yaml and assets/icon/.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # Generate AppLocalizations from lib/l10n/*.arb (config in l10n.yaml).
  generate: true
  # Locally bundled static TTFs and OFL notices. WorkoutType requests only
  # Space Grotesk Regular/Medium and Space Mono Regular; no network is needed.
  assets:
    - assets/google_fonts/
    - assets/character_body/
    - assets/icon/alkion-foreground-1024.png
    - assets/icon/entry/
    # The private *.dev.json projection is included only by the guarded Android
    # trial source set. A normal Flutter build must never glob this directory.
    - assets/catalog_trial/README.md
