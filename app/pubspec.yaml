name: alkion
description: Alkion development client, by Animus. Local foundation qualification.
publish_to: none
version: 0.18.1+37

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Official Flutter localization (ARB/gen_l10n) delegates.
  flutter_localizations:
    sdk: flutter
  # Message formatting / Locale support used by generated AppLocalizations.
  intl: any
  # Standalone SQLite; pinned native factory qualified for local workflows.
  sqlite3: 3.3.2
  sqlite_async: 0.14.2
  # App-support dir for the local DB file.
  path_provider: ^2.1.4
  path: ^1.9.0
  # Google Fonts for Space Grotesk / Hanken Grotesk / JetBrains Mono.
  google_fonts: ^6.2.1
  # Reactive state management (UnitService, ActiveSessionController).
  provider: ^6.1.2
  # Retained test-only preference fixtures; semantic app state uses SQLite.
  shared_preferences: ^2.3.2
  # Export delivery: opens the Android share sheet with the JSON file.
  share_plus: ^11.0.0
  # Ongoing workout notification (Android): chronometer elapsed / rest countdown.
  flutter_local_notifications: ^21.0.0
  # OS-alarm scheduling for the rest-end notification revert (transitive via
  # flutter_local_notifications; declared direct since we import tz/data).
  timezone: ^0.11.0
  # Deterministic v5 ids for the template-absorb migration.
  uuid: ^4.5.0
  # SHA-256 for capture profile and schema evidence digests. Transitive via
  # powersync; declared direct because lib/capture imports it.
  crypto: ^3.0.7
  # Runtime app version footer; no update transport.
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates the Android launcher icon (incl. adaptive) from assets/icon/.
  # Config: flutter_launcher_icons.yaml; sources prepared in docs/flutter_icons/.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # Generate AppLocalizations from lib/l10n/*.arb (config in l10n.yaml).
  generate: true
  # Space Grotesk / Hanken Grotesk / JetBrains Mono static TTFs (OFL, see
  # OFL.txt). Named in google_fonts' asset convention (`Family-Weight.ttf`),
  # so GoogleFonts.* loads them from the bundle with no network; runtime
  # fetching stays on as the fallback for any weight not bundled.
  assets:
    - assets/google_fonts/
