// Android build of the reps/capture plugin. Mirrors the Flutter 3.44 plugin
// template (AGP 9 with built-in Kotlin), in Groovy. NOT enabled: the plugin's
// pubspec lists only linux, so no app build includes this module until it is
// compiled and qualified on an Android SDK host.
group = "io.github.psychonaut0.reps.capture"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.0.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.github.psychonaut0.reps.capture"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
